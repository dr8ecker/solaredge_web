# Transparente manuelle Detailkarte, benötigt card-mod wie die Übersicht.
type: custom:mod-card
card:
  type: entities
  title: SolarEdge · Zähler & Details
  show_header_toggle: false
  state_color: false
  entities:
  - type: section
    label: Energiezähler seit Einrichtung · kWh
  - entity: sensor.solaredge_pv_energy_total
    name: Solarerzeugung
    icon: mdi:solar-power-variant
  - entity: sensor.solaredge_consumption_energy_total
    name: Hausverbrauch
    icon: mdi:home-lightning-bolt-outline
  - entity: sensor.solaredge_self_consumption_energy_total
    name: PV-Eigenverbrauch
    icon: mdi:home-import-outline
  - entity: sensor.solaredge_grid_import_energy_total
    name: Netzbezug
    icon: mdi:transmission-tower-import
  - entity: sensor.solaredge_grid_export_energy_total
    name: Einspeisung
    icon: mdi:transmission-tower-export
  - type: section
    label: Anlage & Datenquelle
  - entity: sensor.solaredge_energy_date
    name: Datum der Tageswerte
  - entity: sensor.solaredge_data_freshness
    name: Datenzustand
    icon: mdi:check-network-outline
  - entity: sensor.solaredge_scraper_poll_interval
    name: Abrufintervall
  - entity: sensor.solaredge_scraper_stale_after
    name: Warnschwelle Datenalter
  - entity: sensor.solaredge_history_import_status
    name: Historienimport
    icon: mdi:database-clock-outline
  - entity: sensor.solaredge_history_last_success
    name: Letzter Historienimport
  - entity: sensor.solaredge_site_status
    name: Anlagenstatus
    icon: mdi:solar-panel-large
  - entity: sensor.solaredge_last_update
    name: SolarEdge-Anzeige beim Abruf
    icon: mdi:web-clock
  - entity: sensor.solaredge_scraper_last_success
    name: Erfolgreich abgerufen
  - entity: sensor.solaredge_scraper_last_attempt
    name: Letzter Abrufversuch
  - entity: sensor.solaredge_scraper_status
    name: Abrufstatus
    icon: mdi:cloud-check-outline
  - entity: sensor.solaredge_scraper_response_time
    name: Abrufdauer
  - entity: sensor.solaredge_energy_gap_count
    name: Fehlende Energietage
    icon: mdi:calendar-alert
  - type: section
    label: © 2026 8ecker.de
  card_mod:
    style: |
      :host(:not([hidden])), ha-card:not([hidden]) {
        background: transparent !important;
        background-image: none !important;
        filter: none !important;
        border: 0 !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-radius: 20px !important;
        --ha-card-background: transparent !important;
        --ha-card-box-shadow: none !important;
        --ha-card-border-width: 0px !important;
      }
      :host::before, :host::after, ha-card::before, ha-card::after {
        content: none !important;
        display: none !important;
        background: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 0 !important;
      }
      ha-card:not([hidden]) { border-radius: 24px !important; overflow: hidden; }
