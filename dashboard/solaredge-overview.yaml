# Als eine manuelle Karte einfügen, nicht in configuration.yaml.
# Benötigt: Add-on ab 0.3.0, Mushroom, mini-graph-card, card-mod.
type: custom:mod-card
card:
  type: vertical-stack
  cards:
    - type: markdown
      content: >-
        <p>SOLAREDGE</p>

        <h2>Dein Energieüberblick</h2>

        {% set value = states('sensor.solaredge_energy_today') %}
        <h1>{{ ('%.2f' | format(value | float) | replace('.', ',')) if is_number(value) else '—' }} <small>kWh</small></h1>

        <p>Solarerzeugung heute</p>
      card_mod:
        style:
          .: |
            :host, ha-card {
              background: transparent;
              border: 0;
              box-shadow: none;
            }
          ha-markdown$: |
            p:first-child {
              color: var(--secondary-text-color);
              font-size: 11px !important;
              font-weight: 700;
              letter-spacing: 3px !important;
              margin: 8px 0 10px;
            }
            h2 { font-size: 19px !important; font-weight: 500 !important; margin: 0 0 18px; }
            h1 {
              color: var(--primary-text-color);
              font-size: clamp(42px, 11vw, 62px) !important;
              font-weight: 700;
              letter-spacing: -2px;
              line-height: 1.1;
              margin: 0;
            }
            h1 small { font-size: 20px !important; font-weight: 400; letter-spacing: 0; }
            p:last-child { color: var(--secondary-text-color); margin: 8px 0 0; }
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
        - type: template
          entity: sensor.solaredge_data_freshness
          icon: >-
            {% set s = states(entity) %}
            {{ 'mdi:check-circle' if s == 'fresh' else 'mdi:sync' if s == 'updating' else 'mdi:alert-circle-outline' }}
          icon_color: >-
            {% set s = states(entity) %}
            {{ '#14b8a6' if s == 'fresh' else '#60a5fa' if s == 'updating' else '#f6b44b' }}
          content: >-
            {% set s = states(entity) %}
            {% set labels = {'fresh': 'Daten aktuell', 'updating': 'Wird abgerufen', 'waiting': 'Warte auf Daten', 'retrying': 'Neuer Versuch', 'stale': 'Daten veraltet', 'error': 'Abruffehler', 'login_required': 'Login erforderlich', 'manual_login_required': 'Login bestätigen', 'mqtt_disconnected': 'MQTT getrennt', 'rate_limited': 'Abruf pausiert', 'energy_ledger_error': 'Zähler prüfen', 'offline': 'Offline', 'unavailable': 'Nicht verfügbar', 'unknown': 'Noch keine Daten'} %}
            {{ labels.get(s, 'Status prüfen') }}
          tap_action:
            action: more-info
        - type: entity
          entity: sensor.solaredge_outside_temperature
          icon: mdi:thermometer
          icon_color: '#f6b44b'
          tap_action:
            action: more-info
        - type: action
          icon: mdi:chart-box-outline
          tap_action:
            action: navigate
            navigation_path: /energy
      card_mod:
        style: |
          :host, ha-card { padding: 4px 16px 16px; }
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_consumption_energy_today
          name: Haus heute
          icon: mdi:home-lightning-bolt-outline
          icon_color: '#36bcc8'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_self_consumption_energy_today
          name: PV selbst genutzt
          icon: mdi:home-import-outline
          icon_color: '#f6b44b'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_grid_import_energy_today
          name: Netzbezug heute
          icon: mdi:transmission-tower-import
          icon_color: '#60a5fa'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_grid_export_energy_today
          name: Einspeisung heute
          icon: mdi:transmission-tower-export
          icon_color: '#14b8a6'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          entity: sensor.solaredge_autarky_today
          icon: mdi:home-percent-outline
          icon_color: '#14b8a6'
          content: >-
            {% set n = states(entity) %}
            Autarkie {{ (('%.1f' | format(n | float)) | replace('.', ',')) ~ ' %' if is_number(n) else '—' }}
          tap_action:
            action: more-info
        - type: template
          entity: sensor.solaredge_self_consumption_ratio_today
          icon: mdi:solar-power-variant
          icon_color: '#f6b44b'
          content: >-
            {% set n = states(entity) %}
            Eigenverbrauch {{ (('%.1f' | format(n | float)) | replace('.', ',')) ~ ' %' if is_number(n) else '—' }}
          tap_action:
            action: more-info
      card_mod:
        style: |
          :host, ha-card { padding: 8px 8px 12px; }
    - type: markdown
      content: '#### Leistung beim letzten Abruf'
      card_mod:
        style: |
          :host, ha-card { background: transparent; border: 0; box-shadow: none; }
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_pv_power
          name: PV-Leistung
          icon: mdi:solar-power-variant
          icon_color: '#f6b44b'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_consumption_power
          name: Hausverbrauch
          icon: mdi:home-lightning-bolt-outline
          icon_color: '#36bcc8'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_grid_import_power
          name: Netzbezug
          icon: mdi:transmission-tower-import
          icon_color: '#60a5fa'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.solaredge_grid_export_power
          name: Einspeisung
          icon: mdi:transmission-tower-export
          icon_color: '#14b8a6'
          primary_info: state
          secondary_info: name
          layout: horizontal
          tap_action:
            action: more-info
    - type: custom:mini-graph-card
      name: Leistungsverlauf · 24 Stunden
      icon: mdi:chart-line
      entities:
        - entity: sensor.solaredge_pv_power
          name: PV
          color: '#f6b44b'
        - entity: sensor.solaredge_consumption_power
          name: Haus
          color: '#36bcc8'
      hours_to_show: 24
      points_per_hour: 2
      aggregate_func: last
      smoothing: false
      value_factor: -3
      unit: kW
      decimals: 2
      hour24: true
      height: 110
      line_width: 3
      lower_bound: 0
      show:
        state: false
        labels: true
        legend: true
        fill: fade
        points: hover
      card_mod:
        style: |
          :host, ha-card { background: transparent; border: 0; box-shadow: none; }
          .header { font-size: 14px; }
    - type: markdown
      content: >-
        {% set stamp = as_timestamp(states('sensor.solaredge_scraper_last_success'), none) %}
        {% if stamp is not none %}
          {% set age = ((as_timestamp(now()) - stamp) / 60) | int %}
          **Datenstand:** {{ stamp | timestamp_custom('%d.%m. · %H:%M', true) }}
          {% set limit = states('sensor.solaredge_scraper_stale_after') | float(5400) / 60 %}
          {% if age > limit %} · ⚠ Daten älter als {{ limit | int }} Min.{% endif %}
        {% else %}
          **Datenstand:** Noch kein erfolgreicher Abruf verfügbar.
        {% endif %}

        {% set interval = states('sensor.solaredge_scraper_poll_interval') %}
        Momentaufnahmen · {{ 'Abruf alle ' ~ ('%g' | format(interval | float / 60)) ~ ' Min.' if is_number(interval) else 'Intervall nicht verfügbar' }}

        {% if is_state('sensor.solaredge_history_import_status', 'error') %}
        ⚠ Historienimport gestört. Aktuelle Sensorwerte werden weiter übertragen.
        {% elif is_state('sensor.solaredge_history_import_status', 'supervisor_required') %}
        ⚠ Historienimport benötigt den Zugriff auf Home Assistant über den Supervisor.
        {% endif %}

        {% set gaps = states('sensor.solaredge_energy_gap_count') %}
        {% if is_number(gaps) and gaps | int > 0 %}
        ⚠ {{ gaps | int }} Energietage fehlen. Die Gesamtbilanz ist unvollständig.
        {% endif %}
      card_mod:
        style:
          .: |
            :host, ha-card { background: transparent; border: 0; box-shadow: none; }
          ha-markdown$: |
            p { color: var(--secondary-text-color); font-size: 12px; line-height: 1.6; margin: 0 0 4px; }
# Die Hülle setzt zusätzlich die Überschrift über ihren eigenen DOM-Pfad.
# Das greift auch, wenn verschachtelte card-mod-Stile erst verspätet laden.
card_mod:
  style:
    .: |
      :host, ha-card {
        border-radius: 24px !important;
        --vertical-stack-card-gap: 0px;
        overflow: hidden !important;
        border: 1px solid var(--divider-color);
        background: radial-gradient(ellipse at top right, rgba(246, 180, 75, 0.16), transparent 65%),
                    var(--ha-card-background, var(--card-background-color, #1c1c1c)) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
    hui-vertical-stack-card $:
      hui-markdown-card $:
        ha-markdown $: |
          h1 {
            font-size: clamp(42px, 11vw, 62px) !important;
            font-weight: 700 !important;
            letter-spacing: -2px !important;
            line-height: 1.1 !important;
            margin: 0 !important;
          }
          h1 small { font-size: 20px !important; font-weight: 400 !important; letter-spacing: 0 !important; }
          h2 { font-size: 19px !important; font-weight: 500 !important; margin: 0 0 18px !important; }
