type: custom:mod-card
card:
  type: vertical-stack
  cards:
  - type: markdown
    content: |-
      <p>SOLAREDGE</p>
      <h2>Dein Energieüberblick</h2>
      {% set value = states('sensor.solaredge_energy_today') %} <h1>{{ ('%.2f' | format(value | float) | replace('.', ',')) if is_number(value) else '—' }} <small>kWh</small></h1>
      <p>Solarerzeugung heute</p>
    card_mod:
      style:
        .: |
          :host(:not([hidden])), ha-card:not([hidden]) {
            background: transparent !important;
            background-image: none !important;
            filter: none !important;
            border: 0 !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-radius: 20px !important;
            --ha-card-background: transparent !important;
            --ha-card-box-shadow: none !important;
            --ha-card-border-width: 0px !important;
          }
          :host::before, :host::after, ha-card::before, ha-card::after {
            content: none !important;
            display: none !important;
            background: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 0 !important;
          }
          ha-card { padding: 0 !important; }
          ha-markdown { padding: 0 !important; }
        ha-markdown$: |
          p:first-child {
            color: var(--secondary-text-color);
            font-size: 10px !important;
            font-weight: 700;
            letter-spacing: 3px;
            margin: 0 0 12px;
          }
          h2 { font-size: 20px !important; font-weight: 500 !important; margin: 0 0 20px; }
          h1 {
            color: var(--primary-text-color);
            font-size: clamp(46px, 11vw, 58px) !important;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.12;
            margin: 0;
          }
          h1 small { font-size: 20px !important; font-weight: 400; letter-spacing: 0; margin-left: 4px; }
          p:last-child { color: var(--secondary-text-color); font-size: 13px; margin: 8px 0 0; }
  - type: custom:mushroom-chips-card
    alignment: start
    chips:
    - type: template
      entity: sensor.solaredge_data_freshness
      icon: '{% set s = states(entity) %} {{ ''mdi:check-circle'' if s == ''fresh'' else ''mdi:sync'' if s == ''updating'' else ''mdi:alert-circle-outline''
        }}'
      icon_color: '{% set s = states(entity) %} {{ ''#14b8a6'' if s == ''fresh'' else ''#60a5fa'' if s == ''updating'' else ''#f6b44b''
        }}'
      content: '{% set s = states(entity) %} {% set labels = {''fresh'': ''Daten aktuell'', ''updating'': ''Wird abgerufen'', ''waiting'':
        ''Warte auf Daten'', ''retrying'': ''Neuer Versuch'', ''stale'': ''Daten veraltet'', ''error'': ''Abruffehler'', ''login_required'':
        ''Login erforderlich'', ''manual_login_required'': ''Login bestätigen'', ''terms_confirmation_required'': ''Nutzungsbedingungen prüfen'', ''mqtt_disconnected'': ''MQTT getrennt'', ''rate_limited'':
        ''Abruf pausiert'', ''energy_ledger_error'': ''Zähler prüfen'', ''offline'': ''Offline'', ''unavailable'': ''Nicht verfügbar'',
        ''unknown'': ''Noch keine Daten''} %} {{ labels.get(s, ''Status prüfen'') }}'
      tap_action:
        action: more-info
    - type: entity
      entity: sensor.solaredge_outside_temperature
      icon: mdi:thermometer
      icon_color: '#f6b44b'
      tap_action:
        action: more-info
    - type: action
      icon: mdi:chart-box-outline
      tap_action:
        action: navigate
        navigation_path: /energy
