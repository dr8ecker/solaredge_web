  - type: markdown
    content: |-
      {% set stamp = as_timestamp(states('sensor.solaredge_scraper_last_success'), none) %} {% if stamp is not none %}
        {% set age = ((as_timestamp(now()) - stamp) / 60) | int %}
        **Datenstand:** {{ stamp | timestamp_custom('%d.%m. · %H:%M', true) }}
        {% set limit = states('sensor.solaredge_scraper_stale_after') | float(5400) / 60 %}
        {% if age > limit %} · ⚠ Daten älter als {{ limit | int }} Min.{% endif %}
      {% else %}
        **Datenstand:** Noch kein erfolgreicher Abruf verfügbar.
      {% endif %}
      {% set interval = states('sensor.solaredge_scraper_poll_interval') %} Momentaufnahmen · {{ 'Abruf alle ' ~ ('%g' | format(interval | float / 60)) ~ ' Min.' if is_number(interval) else 'Intervall nicht verfügbar' }}
      {% if is_state('sensor.solaredge_history_import_status', 'error') %} ⚠ Historienimport gestört. Aktuelle Sensorwerte werden weiter übertragen. {% elif is_state('sensor.solaredge_history_import_status', 'supervisor_required') %} ⚠ Historienimport benötigt den Zugriff auf Home Assistant über den Supervisor. {% endif %}
      {% set gaps = states('sensor.solaredge_energy_gap_count') %} {% if is_number(gaps) and gaps | int > 0 %} ⚠ {{ gaps | int }} Energietage fehlen. Die Gesamtbilanz ist unvollständig. {% endif %}

      © 2026 [8ecker.de](https://8ecker.de)
